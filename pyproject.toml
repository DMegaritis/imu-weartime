[tool.poetry]
name = "imu-weartime"
version = "1.0.0"
description = "Wear-time detection algorithms for IMU wearable sensors"
authors = ["Dr Dimitrios Megaritis <d.megaritis@northumbria.ac.uk>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = true
packages = [{include = "imu_weartime", from = "src"}]
include = [
    "src/imu_weartime/weartime/production_models/*.pkl",
    "src/imu_weartime/weartime/production_models/*.keras"
]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
pyentrp = "2.1.0"
typing-extensions = ">=4.5.0"
mobgap = "==1.1.0"
xgboost = "1.7.5"
tensorflow = "2.18.0"
pandas = ">=1.5.0"
numpy = ">=1.23.0"
scikit-learn = ">=1.2.0"
multigait = "0.2.1"
poethepoet = ">=0.22.0,<0.23"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0,<8"
numpydoc = ">=1.6.0,<2"
shap = ">=0.49.0"
h5py = ">=3.8.0"
psutil = ">=5.9.0"
ruff = ">=0.5.0"
pytest-cov = ">=4.1.0,<5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
_format = "ruff format ."
_auto_fix = "ruff check . --fix-only --show-fixes --exit-zero"
format = ["_auto_fix", "_format"]
lint = { cmd = "ruff check src --fix", help = "Lint all files with ruff." }
_lint_ci = "ruff check src --output-format=github"
_check_format = "ruff format . --check"
ci_check = { sequence = ["_check_format", "_lint_ci"], help = "Check all potential format and linting issues." }
test = { cmd = "pytest tests --cov=src/imu_weartime --cov-report=term-missing --cov-report=xml", help = "Run Pytest with coverage." }